<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf_viewer.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e293b;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      background: #334155;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #475569;
      flex-shrink: 0;
    }
    .toolbar input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 14px;
      min-width: 0;
    }
    .toolbar input[type="text"]:focus {
      outline: none;
      border-color: #f59e0b;
    }
    .toolbar button {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background: #475569;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }
    .toolbar button:hover { background: #64748b; }
    .toolbar button.primary { background: #f59e0b; color: #1e293b; }
    .toolbar button.primary:hover { background: #fbbf24; }
    .search-info {
      font-size: 12px;
      color: #94a3b8;
      white-space: nowrap;
    }
    .search-info.found { color: #4ade80; }
    .search-info.not-found { color: #f87171; }
    .search-info.searching { color: #60a5fa; }
    .viewer {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      background: #0f172a;
      min-width: 0;
    }
    .page-container {
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      background: white;
      flex-shrink: 0;
    }
    .page-container canvas { display: block; }
    .textLayer {
      position: absolute;
      text-align: initial;
      inset: 0;
      overflow: hidden;
      opacity: 1;
      line-height: 1;
      -webkit-text-size-adjust: none;
      -moz-text-size-adjust: none;
      text-size-adjust: none;
      forced-color-adjust: none;
      transform-origin: 0 0;
      z-index: 2;
    }
    .textLayer :is(span, br) {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }
    .textLayer span.markedContent { top: 0; height: 0; }
    .textLayer .highlight {
      background-color: rgba(245, 158, 11, 0.5);
      border-radius: 2px;
      box-shadow: 
        -3px 0 0 rgba(245, 158, 11, 0.5), 
        3px 0 0 rgba(245, 158, 11, 0.5),
        0 -1px 0 rgba(245, 158, 11, 0.5),
        0 1px 0 rgba(245, 158, 11, 0.5);
    }
    .textLayer ::selection { background: rgba(245, 158, 11, 0.4); }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 18px;
      color: #94a3b8;
    }
    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #475569;
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .bottom-bar {
      background: #334155;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-top: 1px solid #475569;
      flex-shrink: 0;
    }
    .bottom-bar button {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: #475569;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 14px;
    }
    .bottom-bar button:hover { background: #64748b; }
    .bottom-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
    .page-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #94a3b8;
    }
    .page-info input {
      width: 60px;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #e2e8f0;
      text-align: center;
      font-size: 14px;
    }
    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      font-size: 13px;
      color: #94a3b8;
    }
    .download-btn {
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .download-btn svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Search in document...">
    <button onclick="findText()" class="primary">Find</button>
    <button onclick="findPrev()">◂ Prev</button>
    <button onclick="findNext()">Next ▸</button>
    <div id="searchInfo" class="search-info"></div>
  </div>

  <div class="viewer" id="viewer">
    <div class="loading">
      <div class="loading-spinner"></div>
      Loading PDF...
    </div>
  </div>

  <div class="bottom-bar">
    <button class="download-btn" onclick="downloadPdf()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V3"/>
      </svg>
      Download
    </button>
    <div class="page-info">
      <button onclick="prevPage()" id="prevBtn">◂</button>
      <input type="number" id="pageInput" min="1" onchange="goToPage(parseInt(this.value))">
      <span>of <span id="totalPages">-</span></span>
      <button onclick="nextPage()" id="nextBtn">▸</button>
    </div>
    <div class="zoom-controls">
      <button onclick="zoomOut()">−</button>
      <span id="zoomLevel">120%</span>
      <button onclick="zoomIn()">+</button>
    </div>
  </div>

  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
    import { TextLayer } from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
    
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

    const params = new URLSearchParams(window.location.search);
    const fileUrl = params.get('file');
    const searchQuery = params.get('search') || '';
    const initialPage = parseInt(window.location.hash.replace('#page=', '')) || 1;

    let pdf = null;
    let currentPage = initialPage;
    let scale = 1.2;
    let currentTextLayer = null;
    let currentSpans = [];
    let matches = [];
    let currentMatchIndex = -1;

    // Normalize text: collapse whitespace, lowercase, remove special chars
    function normalize(text) {
      return text
        .toLowerCase()
        .replace(/[^\w\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    // Store the full query for searching
    let fullSearchQuery = searchQuery;
    
    // Show truncated in input
    const displayQuery = searchQuery.length > 80 
      ? searchQuery.substring(0, 80) + '...' 
      : searchQuery;
    document.getElementById('searchInput').value = displayQuery;

    async function init() {
      try {
        pdf = await pdfjsLib.getDocument(fileUrl).promise;
        document.getElementById('totalPages').textContent = pdf.numPages;
        document.getElementById('pageInput').max = pdf.numPages;
        document.getElementById('pageInput').value = currentPage;
        
        await renderPage(currentPage);
        updateNavButtons();
        
        if (searchQuery) {
          setTimeout(() => highlightContiguousMatch(), 300);
        }
      } catch (err) {
        document.getElementById('viewer').innerHTML = 
          `<div class="loading">Error: ${err.message}</div>`;
      }
    }

    async function renderPage(pageNum) {
      const viewer = document.getElementById('viewer');
      
      try {
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale });

        viewer.innerHTML = '';

        const container = document.createElement('div');
        container.className = 'page-container';
        container.style.width = `${viewport.width}px`;
        container.style.height = `${viewport.height}px`;
        container.style.position = 'relative';

        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.display = 'block';
        container.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport }).promise;

        const textContent = await page.getTextContent();
        const textLayerDiv = document.createElement('div');
        textLayerDiv.className = 'textLayer';
        textLayerDiv.style.width = `${viewport.width}px`;
        textLayerDiv.style.height = `${viewport.height}px`;
        container.appendChild(textLayerDiv);

        const textLayer = new TextLayer({
          textContentSource: textContent,
          container: textLayerDiv,
          viewport: viewport,
        });
        await textLayer.render();
        currentTextLayer = textLayerDiv;
        
        // Store spans for highlighting
        currentSpans = Array.from(textLayerDiv.querySelectorAll('span'));

        viewer.appendChild(container);

        if (fullSearchQuery) {
          highlightContiguousMatch();
        }
        
      } catch (err) {
        console.error('Render error:', err);
        viewer.innerHTML = `<div class="loading">Error rendering page: ${err.message}</div>`;
      }
    }

    // Find and highlight contiguous spans that match the search text
    function highlightContiguousMatch() {
      if (!currentTextLayer || !fullSearchQuery || currentSpans.length === 0) return;

      // Clear old highlights
      currentSpans.forEach(span => span.classList.remove('highlight'));

      const normalizedQuery = normalize(fullSearchQuery);
      
      if (normalizedQuery.length < 10) return;

      // Get normalized text for each span
      const spanTexts = currentSpans.map(span => normalize(span.textContent));
      
      // Concatenate all spans into one string, tracking boundaries
      let pageText = '';
      const spanBoundaries = [];
      
      spanTexts.forEach((text, i) => {
        const start = pageText.length;
        pageText += text + ' ';
        spanBoundaries.push({ start, end: pageText.length - 1, idx: i });
      });

      // Strategy 1: Try to find a direct substring match with progressively shorter query
      let bestMatchStart = -1;
      let bestMatchEnd = -1;
      
      // Try full query first, then shorter and shorter
      for (let len = normalizedQuery.length; len >= 50; len -= 20) {
        for (let start = 0; start <= normalizedQuery.length - len; start += 10) {
          const subQuery = normalizedQuery.slice(start, start + len);
          const idx = pageText.indexOf(subQuery);
          if (idx !== -1) {
            bestMatchStart = idx;
            bestMatchEnd = idx + subQuery.length;
            break;
          }
        }
        if (bestMatchStart !== -1) break;
      }

      // Strategy 2: If no direct match, try word-based matching
      if (bestMatchStart === -1) {
        const queryWords = normalizedQuery.split(' ').filter(w => w.length > 3);
        
        // Find longest sequence of consecutive words that matches
        for (let len = Math.min(queryWords.length, 20); len >= 4; len--) {
          for (let start = 0; start <= queryWords.length - len; start++) {
            const subQuery = queryWords.slice(start, start + len).join(' ');
            const idx = pageText.indexOf(subQuery);
            if (idx !== -1) {
              bestMatchStart = idx;
              bestMatchEnd = idx + subQuery.length;
              break;
            }
          }
          if (bestMatchStart !== -1) break;
        }
      }

      if (bestMatchStart !== -1) {
        // Highlight all spans that overlap with the match
        spanBoundaries.forEach(({ start, end, idx }) => {
          if (end >= bestMatchStart && start <= bestMatchEnd) {
            currentSpans[idx].classList.add('highlight');
          }
        });
        
        updateSearchInfoDisplay(1);
        scrollToHighlight();
      } else {
        updateSearchInfoDisplay(0);
      }
    }

    function scrollToHighlight() {
      setTimeout(() => {
        const firstHighlight = currentTextLayer?.querySelector('.highlight');
        if (firstHighlight) {
          firstHighlight.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 100);
    }

    function updateSearchInfoDisplay(count) {
      const info = document.getElementById('searchInfo');
      if (count === 0) {
        info.textContent = 'No match found on page';
        info.className = 'search-info not-found';
      } else {
        info.textContent = `Found matching section`;
        info.className = 'search-info found';
      }
    }

    // Manual search (when user types and clicks Find)
    async function findText() {
      const inputQuery = document.getElementById('searchInput').value.trim();
      if (!inputQuery) return;
      
      fullSearchQuery = inputQuery;
      highlightContiguousMatch();
    }

    window.findText = findText;
    window.findNext = () => goToPage(currentPage + 1);
    window.findPrev = () => goToPage(currentPage - 1);

    window.goToPage = async function(num) {
      const pageNum = Math.max(1, Math.min(pdf.numPages, parseInt(num) || 1));
      if (pageNum === currentPage) return;
      currentPage = pageNum;
      document.getElementById('pageInput').value = currentPage;
      await renderPage(currentPage);
      updateNavButtons();
    };

    window.prevPage = () => goToPage(currentPage - 1);
    window.nextPage = () => goToPage(currentPage + 1);

    function updateNavButtons() {
      document.getElementById('prevBtn').disabled = currentPage <= 1;
      document.getElementById('nextBtn').disabled = currentPage >= pdf.numPages;
    }

    window.zoomIn = async function() {
      scale = Math.min(3, scale + 0.25);
      document.getElementById('zoomLevel').textContent = Math.round(scale * 100) + '%';
      await renderPage(currentPage);
    };

    window.zoomOut = async function() {
      scale = Math.max(0.5, scale - 0.25);
      document.getElementById('zoomLevel').textContent = Math.round(scale * 100) + '%';
      await renderPage(currentPage);
    };

    window.downloadPdf = function() {
      const a = document.createElement('a');
      a.href = fileUrl;
      a.download = 'document.pdf';
      a.click();
    };

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.id === 'searchInput') findText();
    });

    init();
  </script>
</body>
</html>
