<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf_viewer.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e293b;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      background: #334155;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #475569;
      flex-shrink: 0;
    }
    .toolbar input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 14px;
      min-width: 0;
    }
    .toolbar input[type="text"]:focus {
      outline: none;
      border-color: #f59e0b;
    }
    .toolbar button {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background: #475569;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }
    .toolbar button:hover { background: #64748b; }
    .toolbar button.primary { background: #f59e0b; color: #1e293b; }
    .toolbar button.primary:hover { background: #fbbf24; }
    .search-info {
      font-size: 12px;
      color: #94a3b8;
      white-space: nowrap;
    }
    .search-info.found { color: #4ade80; }
    .search-info.not-found { color: #f87171; }
    .search-info.searching { color: #60a5fa; }
    .viewer {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      background: #0f172a;
    }
    .page-container {
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      background: white;
    }
    .page-container canvas { display: block; }
    .textLayer {
      position: absolute;
      text-align: initial;
      inset: 0;
      overflow: hidden;
      opacity: 1;
      line-height: 1;
      -webkit-text-size-adjust: none;
      -moz-text-size-adjust: none;
      text-size-adjust: none;
      forced-color-adjust: none;
      transform-origin: 0 0;
      z-index: 2;
    }
    .textLayer :is(span, br) {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }
    .textLayer span.markedContent { top: 0; height: 0; }
    .textLayer .highlight {
      margin: -1px;
      padding: 1px;
      background-color: rgba(245, 158, 11, 0.4);
      border-radius: 4px;
    }
    .textLayer .highlight.current {
      background-color: rgba(249, 115, 22, 0.7);
    }
    .textLayer ::selection { background: rgba(245, 158, 11, 0.4); }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 18px;
      color: #94a3b8;
    }
    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #475569;
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .bottom-bar {
      background: #334155;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-top: 1px solid #475569;
      flex-shrink: 0;
    }
    .bottom-bar button {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: #475569;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 14px;
    }
    .bottom-bar button:hover { background: #64748b; }
    .bottom-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
    .page-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #94a3b8;
    }
    .page-info input {
      width: 60px;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #e2e8f0;
      text-align: center;
      font-size: 14px;
    }
    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      font-size: 13px;
      color: #94a3b8;
    }
    .download-btn {
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .download-btn svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Search in document...">
    <button onclick="findText()" class="primary">Find</button>
    <button onclick="findPrev()">◂ Prev</button>
    <button onclick="findNext()">Next ▸</button>
    <div id="searchInfo" class="search-info"></div>
  </div>

  <div class="viewer" id="viewer">
    <div class="loading">
      <div class="loading-spinner"></div>
      Loading PDF...
    </div>
  </div>

  <div class="bottom-bar">
    <button class="download-btn" onclick="downloadPdf()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V3"/>
      </svg>
      Download
    </button>
    <div class="page-info">
      <button onclick="prevPage()" id="prevBtn">◂</button>
      <input type="number" id="pageInput" min="1" onchange="goToPage(parseInt(this.value))">
      <span>of <span id="totalPages">-</span></span>
      <button onclick="nextPage()" id="nextBtn">▸</button>
    </div>
    <div class="zoom-controls">
      <button onclick="zoomOut()">−</button>
      <span id="zoomLevel">100%</span>
      <button onclick="zoomIn()">+</button>
    </div>
  </div>

  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
    import { TextLayer } from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
    
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

    const params = new URLSearchParams(window.location.search);
    const fileUrl = params.get('file');
    const searchQuery = params.get('search') || '';
    const initialPage = parseInt(window.location.hash.replace('#page=', '')) || 1;

    let pdf = null;
    let currentPage = initialPage;
    let scale = 1.5;
    let currentTextLayer = null;
    let matches = [];
    let currentMatchIndex = -1;

    // Normalize text for comparison - collapse whitespace, lowercase
    function normalizeText(text) {
      return text.replace(/\s+/g, ' ').trim().toLowerCase();
    }

    // Extract meaningful search words from the searchable text
    // We'll search for individual words that are likely to be unique
    function extractSearchWords(text) {
      const normalized = normalizeText(text);
      // Split into words, filter out very short/common words
      const words = normalized.split(' ').filter(w => w.length > 3);
      // Return unique words
      return [...new Set(words)];
    }

    // For display in search box, show a truncated version
    const displayQuery = searchQuery.length > 100 
      ? searchQuery.substring(0, 100) + '...' 
      : searchQuery;
    document.getElementById('searchInput').value = displayQuery;
    
    // Store the full query for searching
    let fullSearchQuery = searchQuery;

    async function init() {
      try {
        pdf = await pdfjsLib.getDocument(fileUrl).promise;
        document.getElementById('totalPages').textContent = pdf.numPages;
        document.getElementById('pageInput').max = pdf.numPages;
        document.getElementById('pageInput').value = currentPage;
        
        await renderPage(currentPage);
        updateNavButtons();
        
        if (searchQuery) {
          setTimeout(() => findTextOnCurrentPage(), 500);
        }
      } catch (err) {
        document.getElementById('viewer').innerHTML = 
          `<div class="loading">Error: ${err.message}</div>`;
      }
    }

    async function renderPage(pageNum) {
      const viewer = document.getElementById('viewer');
      
      try {
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale });

        viewer.innerHTML = '';

        const container = document.createElement('div');
        container.className = 'page-container';
        container.style.width = `${viewport.width}px`;
        container.style.height = `${viewport.height}px`;
        container.style.position = 'relative';

        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.display = 'block';
        container.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport }).promise;

        const textContent = await page.getTextContent();
        const textLayerDiv = document.createElement('div');
        textLayerDiv.className = 'textLayer';
        textLayerDiv.style.width = `${viewport.width}px`;
        textLayerDiv.style.height = `${viewport.height}px`;
        container.appendChild(textLayerDiv);

        const textLayer = new TextLayer({
          textContentSource: textContent,
          container: textLayerDiv,
          viewport: viewport,
        });
        await textLayer.render();
        currentTextLayer = textLayerDiv;

        viewer.appendChild(container);

        // Auto-highlight on current page if we have a search query
        if (fullSearchQuery) {
          highlightMatchingSpans();
        }
        
      } catch (err) {
        console.error('Render error:', err);
        viewer.innerHTML = `<div class="loading">Error rendering page: ${err.message}</div>`;
      }
    }

    // Highlight spans that contain words from our search text
    function highlightMatchingSpans() {
      if (!currentTextLayer || !fullSearchQuery) return;

      // Clear old highlights
      currentTextLayer.querySelectorAll('.highlight').forEach(el => {
        el.classList.remove('highlight', 'current');
      });

      const searchWords = extractSearchWords(fullSearchQuery);
      if (searchWords.length === 0) return;

      const spans = currentTextLayer.querySelectorAll('span');
      let matchCount = 0;
      let firstMatch = null;

      spans.forEach(span => {
        const spanText = normalizeText(span.textContent);
        // Check if this span contains any of our search words
        const hasMatch = searchWords.some(word => spanText.includes(word));
        if (hasMatch) {
          span.classList.add('highlight');
          matchCount++;
          if (!firstMatch) firstMatch = span;
        }
      });

      // Mark first match as current and scroll to it
      if (firstMatch) {
        firstMatch.classList.add('current');
        setTimeout(() => {
          firstMatch.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      }

      updateSearchInfoDisplay(matchCount);
    }

    function updateSearchInfoDisplay(count) {
      const info = document.getElementById('searchInfo');
      if (count === 0) {
        info.textContent = 'No matches on page';
        info.className = 'search-info not-found';
      } else {
        info.textContent = `${count} matches on page`;
        info.className = 'search-info found';
      }
    }

    // Search just on current page (for initial load)
    function findTextOnCurrentPage() {
      highlightMatchingSpans();
    }

    // Full document search (when user clicks Find)
    async function findText() {
      const inputQuery = document.getElementById('searchInput').value.trim();
      if (!inputQuery) return;
      
      // Update the full search query if user typed something new
      fullSearchQuery = inputQuery;

      matches = [];
      currentMatchIndex = -1;
      
      const info = document.getElementById('searchInfo');
      info.textContent = 'Searching...';
      info.className = 'search-info searching';

      const searchWords = extractSearchWords(fullSearchQuery);
      if (searchWords.length === 0) {
        info.textContent = 'No searchable terms';
        info.className = 'search-info not-found';
        return;
      }

      // Search all pages
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();
        
        const pageText = normalizeText(textContent.items.map(item => item.str).join(' '));
        
        // Check if any search words appear on this page
        const hasMatch = searchWords.some(word => pageText.includes(word));
        if (hasMatch) {
          matches.push({ page: pageNum });
        }

        if (pageNum % 50 === 0) {
          info.textContent = `Searching... ${pageNum}/${pdf.numPages}`;
          await new Promise(r => setTimeout(r, 0));
        }
      }

      if (matches.length > 0) {
        // Find first match on or after current page
        let idx = matches.findIndex(m => m.page >= currentPage);
        if (idx === -1) idx = 0;
        currentMatchIndex = idx;
        await goToMatch(currentMatchIndex);
      }

      updateSearchInfo();
    }

    async function goToMatch(idx) {
      if (idx < 0 || idx >= matches.length) return;
      
      const match = matches[idx];
      if (match.page !== currentPage) {
        currentPage = match.page;
        document.getElementById('pageInput').value = currentPage;
        await renderPage(currentPage);
        updateNavButtons();
      } else {
        highlightMatchingSpans();
      }
    }

    function updateSearchInfo() {
      const info = document.getElementById('searchInfo');
      if (matches.length === 0) {
        info.textContent = 'No matches in document';
        info.className = 'search-info not-found';
      } else {
        info.textContent = `Page ${currentMatchIndex + 1} of ${matches.length} with matches`;
        info.className = 'search-info found';
      }
    }

    window.findText = findText;
    
    window.findNext = async function() {
      if (matches.length === 0) {
        await findText();
        return;
      }
      currentMatchIndex = (currentMatchIndex + 1) % matches.length;
      await goToMatch(currentMatchIndex);
      updateSearchInfo();
    };

    window.findPrev = async function() {
      if (matches.length === 0) {
        await findText();
        return;
      }
      currentMatchIndex = (currentMatchIndex - 1 + matches.length) % matches.length;
      await goToMatch(currentMatchIndex);
      updateSearchInfo();
    };

    window.goToPage = async function(num) {
      const pageNum = Math.max(1, Math.min(pdf.numPages, parseInt(num) || 1));
      if (pageNum === currentPage) return;
      currentPage = pageNum;
      document.getElementById('pageInput').value = currentPage;
      await renderPage(currentPage);
      updateNavButtons();
    };

    window.prevPage = () => goToPage(currentPage - 1);
    window.nextPage = () => goToPage(currentPage + 1);

    function updateNavButtons() {
      document.getElementById('prevBtn').disabled = currentPage <= 1;
      document.getElementById('nextBtn').disabled = currentPage >= pdf.numPages;
    }

    window.zoomIn = async function() {
      scale = Math.min(3, scale + 0.25);
      document.getElementById('zoomLevel').textContent = Math.round(scale / 1.5 * 100) + '%';
      await renderPage(currentPage);
    };

    window.zoomOut = async function() {
      scale = Math.max(0.5, scale - 0.25);
      document.getElementById('zoomLevel').textContent = Math.round(scale / 1.5 * 100) + '%';
      await renderPage(currentPage);
    };

    window.downloadPdf = function() {
      const a = document.createElement('a');
      a.href = fileUrl;
      a.download = 'document.pdf';
      a.click();
    };

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.id === 'searchInput') findText();
      if (e.key === 'F3' || (e.ctrlKey && e.key === 'g')) { e.preventDefault(); window.findNext(); }
      if (e.shiftKey && e.key === 'F3') { e.preventDefault(); window.findPrev(); }
    });

    init();
  </script>
</body>
</html>
